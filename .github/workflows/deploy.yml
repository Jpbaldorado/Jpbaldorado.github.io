name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without a new commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Empty for a static-only deploy: the contact form falls back to
          # mailto. Point this at a hosted API to switch the form back to POST.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # '/' for a user site (jpbaldorado.github.io). For a project site set
          # the repository variable to '/<repo-name>/'.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
