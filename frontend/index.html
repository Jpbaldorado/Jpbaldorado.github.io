<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>John Patrick Baldorado — Network Engineer</title>
    <meta
      name="description"
      content="Network Engineer specialising in infrastructure architecture and automation. Multi-site enterprise deployment, routing and switching, firewall hardening, and cloud identity."
    />
    <meta name="theme-color" content="#1E1E1E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Runs before first paint and before React mounts. Without this, the
      document renders in the default theme for one frame and then snaps to the
      stored theme — the flash the brief rules out.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jpb-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {
          /* private mode or storage disabled: keep the dark default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
